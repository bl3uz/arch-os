<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>archOS</title>
  <style>
    :root {
      --accent: #2ee6d6;
      --accent-dim: rgba(46, 230, 214, 0.35);
      --warn: #ffcf5c;
      --danger: #e8632f;
      --bg: rgba(8, 24, 28, 0.42);
      --bar: rgba(16, 41, 47, 0.55);
      --border: #1b3d45;
      --text: #dcf6f2;
      --muted: #6f959c;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #040d10 radial-gradient(circle at 50% 35%, #0c262d 0%, #040d10 75%);
      color: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    }

    /* subtle CRT scanlines */
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 999999;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
    }

    .win {
      position: fixed;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px #030c0e, 0 0 0 3px rgba(28,61,69,0.35), 0 22px 50px -16px rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: flex; flex-direction: column;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .win:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 24px var(--accent-dim), 0 24px 54px -14px rgba(0,0,0,0.9);
    }

    .bar {
      display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
      background: var(--bar); border-bottom: 1px solid var(--border);
      cursor: grab; user-select: none; flex: none;
    }
    .bar.dragging { cursor: grabbing; }

    .dots { display: flex; gap: 5px; }
    .dot { width: 8px; height: 8px; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35); }
    .dot.close { background: var(--danger); cursor: pointer; }
    .dot.min   { background: var(--warn); cursor: pointer; }
    .dot.max   { background: var(--accent); }
    .title { margin-left: auto; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

    .body { padding: 10px 12px; font-size: 13px; overflow: auto; }

    /* Interactive Terminal */
    .term-out {
      margin: 0; max-height: 220px; overflow-y: auto;
      font-size: 12px; line-height: 1.45; white-space: pre-wrap; color: #b9d9d6;
    }
    .term-out b { color: var(--accent); font-weight: 600; }
    .term-in { display: flex; align-items: center; gap: 8px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
    .prompt { color: var(--accent); }
    #cmd {
      flex: 1; background: transparent; border: 0; outline: 0; color: var(--text);
      font: inherit; font-size: 12px; caret-color: var(--accent);
    }

    /* Slime */
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: pointer; }
    .slime-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 10px; color: var(--accent); }
    .btn {
      padding: 2px 7px; border: 1px solid var(--border); background: transparent;
      color: var(--muted); font: inherit; font-size: 9px; text-transform: uppercase; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); color: var(--text); }

    /* Taskbar */
    #taskbar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: min(620px, calc(100vw - 32px));
      background: var(--bg); border: 1px solid var(--border);
      padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      z-index: 999990; backdrop-filter: blur(6px);
    }
    .tb-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .pill {
      padding: 3px 8px; border: 1px solid var(--border); background: rgba(7,21,24,0.5);
      color: var(--muted); font: inherit; font-size: 10px; cursor: pointer;
    }
    .pill.open { border-color: var(--accent); color: var(--text); }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .tray { font-size: 10px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>

  <!-- Interactive Terminal Window -->
  <div class="win" id="win-term" style="top:44px;left:50%;width:min(480px,calc(100vw - 32px));transform:translateX(-50%)">
    <div class="bar">
      <div class="dots"><button class="dot close" title="Close"></button><button class="dot min" title="Minimize"></button><span class="dot max"></span></div>
      <span class="title">term.sh</span>
    </div>
    <div class="body">
      <div class="term-out" id="out">welcome to <b>archOS</b> — type <b>help</b> to see commands.</div>
      <div class="term-in">
        <span class="prompt">arch@os:~$</span>
        <input id="cmd" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false" autofocus />
      </div>
    </div>
  </div>

  <!-- Slime Pet Window -->
  <div class="win" id="win-slime" style="top:44px;left:24px;width:260px">
    <div class="bar">
      <div class="dots"><button class="dot close" title="Close"></button><button class="dot min" title="Minimize"></button><span class="dot max"></span></div>
      <span class="title">slime.sh</span>
    </div>
    <div class="body">
      <canvas id="cv" width="130" height="58"></canvas>
      <div class="slime-bar">
        <button class="btn" id="feed">feed</button>
        <span id="mood">vibing</span>
      </div>
    </div>
  </div>

  <!-- Bottom Taskbar -->
  <div id="taskbar">
    <div class="tb-group" id="tb-apps"></div>
    <div class="tray">
      <span id="bat">--%</span>
      <span id="clk">--:--</span>
      <button class="btn" id="reset" style="color:var(--danger);border-color:rgba(232,99,47,0.4)">reset</button>
    </div>
  </div>

  <script>
    (function () {
      var KEY = "archos_v1";
      var state = {};
      try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
      function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

      var THEMES = {
        teal:     { accent: "#2ee6d6", dim: "rgba(46,230,214,0.35)" },
        amber:    { accent: "#ffcf5c", dim: "rgba(255,207,92,0.35)" },
        coral:    { accent: "#e8632f", dim: "rgba(232,99,47,0.35)" },
        lavender: { accent: "#c792ea", dim: "rgba(199,146,234,0.35)" }
      };
      function setTheme(name) {
        var t = THEMES[name];
        if (!t) return false;
        document.documentElement.style.setProperty("--accent", t.accent);
        document.documentElement.style.setProperty("--accent-dim", t.dim);
        state.theme = name; save();
        return true;
      }
      if (state.theme) setTheme(state.theme);

      /* ---- Window Manager ---- */
      var z = 100;
      var apps = {};
      function bindWindow(id, el) {
        var st = state[id] || (state[id] = {});
        var bar = el.querySelector(".bar");
        var body = el.querySelector(".body");
        var closeBtn = el.querySelector(".close");
        var minBtn = el.querySelector(".min");

        if (typeof st.left === "number") {
          el.style.transform = "none";
          el.style.left = st.left + "px";
          el.style.top = st.top + "px";
        }
        if (st.closed) el.style.display = "none";
        if (st.min) body.style.display = "none";

        function setOpen(open) {
          st.closed = !open;
          el.style.display = open ? "" : "none";
          if (open) el.style.zIndex = ++z;
          save(); renderBar();
        }
        el.addEventListener("pointerdown", function () { el.style.zIndex = ++z; });
        closeBtn.addEventListener("click", function (e) { e.stopPropagation(); setOpen(false); });
        minBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          st.min = !st.min;
          body.style.display = st.min ? "none" : "";
          save(); renderBar();
        });

        bar.addEventListener("pointerdown", function (e) {
          if (e.target === closeBtn || e.target === minBtn) return;
          e.preventDefault();
          var r = el.getBoundingClientRect();
          el.style.transform = "none";
          el.style.left = r.left + "px";
          el.style.top = r.top + "px";
          bar.classList.add("dragging");
          var dx = e.clientX - r.left, dy = e.clientY - r.top;
          function move(ev) {
            st.left = Math.max(0, Math.min(window.innerWidth - r.width, ev.clientX - dx));
            st.top  = Math.max(0, Math.min(window.innerHeight - r.height, ev.clientY - dy));
            el.style.left = st.left + "px";
            el.style.top  = st.top + "px";
          }
          function up() {
            bar.classList.remove("dragging");
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            save();
          }
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });

        apps[id] = {
          isOpen: function () { return el.style.display !== "none" && !st.min; },
          open: function () { st.min = false; body.style.display = ""; setOpen(true); },
          close: function () { setOpen(false); }
        };
      }

      bindWindow("term.sh", document.getElementById("win-term"));
      bindWindow("slime.sh", document.getElementById("win-slime"));

      var tbApps = document.getElementById("tb-apps");
      function renderBar() {
        tbApps.innerHTML = Object.keys(apps).map(function (id) {
          var open = apps[id].isOpen();
          return '<button class="pill ' + (open ? 'open' : '') + '" data-app="' + id + '">' + (open ? '● ' : '○ ') + id + '</button>';
        }).join("");
      }
      tbApps.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-app]");
        if (!btn) return;
        var a = apps[btn.dataset.app];
        if (a.isOpen()) a.close(); else a.open();
      });
      renderBar();

      document.getElementById("reset").addEventListener("click", function () {
        localStorage.removeItem(KEY);
        location.reload();
      });

      /* ---- Interactive Terminal ---- */
      var out = document.getElementById("out");
      var cmd = document.getElementById("cmd");
      function print(html) {
        out.innerHTML += "\n" + html;
        out.scrollTop = out.scrollHeight;
      }
      cmd.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        var raw = cmd.value.trim();
        cmd.value = "";
        if (!raw) return;
        print('<span class="prompt">arch@os:~$</span> ' + raw.replace(/</g, "&lt;"));
        var parts = raw.split(/\s+/);
        var c = parts[0].toLowerCase(), arg = parts.slice(1).join(" ");
        if (c === "help") print("commands: <b>neofetch</b>, <b>theme</b> [teal|amber|coral|lavender], <b>open</b> [app], <b>g</b> &lt;query&gt;, <b>clear</b>");
        else if (c === "clear") out.innerHTML = "";
        else if (c === "neofetch") print("<b>   /\\</b>      archOS web\n<b>  /  \\</b>     theme: " + (state.theme || "teal") + "\n<b> /    \\</b>    host: chromebook");
        else if (c === "theme") print(setTheme(arg) ? "theme set to <b>" + arg + "</b>" : "try: teal, amber, coral, lavender");
        else if (c === "open" && apps[arg]) { apps[arg].open(); print("opened <b>" + arg + "</b>"); }
        else if (c === "g" && arg) window.open("https://www.google.com/search?q=" + encodeURIComponent(arg), "_blank");
        else print("unknown command: " + c + " (try <b>help</b>)");
      });

      /* ---- Slime ---- */
      var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
      var mood = document.getElementById("mood");
      var s = { x: 70, y: 44, vy: 0, dir: 1, t: 0 }, food = null;
      document.getElementById("feed").onclick = function () { food = { x: 30 + Math.random()*75, y: 8, vy: 0 }; mood.textContent = "snack!"; };
      cv.onclick = function () { s.vy = -2.2; mood.textContent = "happy!"; };
      function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
      function loop() {
        s.t++;
        if (food) { food.vy += 0.14; food.y += food.vy; if (food.y >= 41) { food.y = 41; food.vy = 0; } }
        if (food) {
          var dx = food.x - s.x;
          if (Math.abs(dx) > 3) { s.dir = dx > 0 ? 1 : -1; s.x += s.dir * 0.55; }
          else { food = null; s.vy = -1.8; mood.textContent = "nom nom"; }
        } else if (s.t % 2 === 0) {
          s.x += s.dir * 0.22;
          if (s.x > 112) s.dir = -1; if (s.x < 32) s.dir = 1;
        }
        if (s.y < 44 || s.vy < 0) { s.vy += 0.14; s.y += s.vy; if (s.y >= 44) { s.y = 44; s.vy = 0; } }
        ctx.clearRect(0,0,130,58);
        px(6,44,118,3,"#1b3d45");
        if (food) px(food.x-2, food.y-1, 4, 4, "#e8632f");
        var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2ee6d6";
        var sq = s.y < 44 ? -2 : Math.sin(s.t*0.14)*1.2;
        var sw = Math.round(16 + sq*1.4), sh = Math.round(11 - sq);
        var sx = Math.round(s.x - sw/2), sy = Math.round(s.y - sh);
        px(sx+2,sy,sw-4,sh,accent); px(sx,sy+3,sw,sh-3,accent);
        px(sx+5,sy+4,2,2,"#04211e"); px(sx+9,sy+4,2,2,"#04211e");
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      /* ---- Clock & Battery ---- */
      setInterval(function () {
        var d = new Date(), p = function (n) { return n < 10 ? "0"+n : n; };
        document.getElementById("clk").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
      }, 1000);
      if (navigator.getBattery) navigator.getBattery().then(function (b) {
        function u() { document.getElementById("bat").textContent = (b.charging ? "⚡" : "") + Math.round(b.level*100) + "%"; }
        u(); b.addEventListener("levelchange", u); b.addEventListener("chargingchange", u);
      });
    })();
  </script>
</body>
</html>
